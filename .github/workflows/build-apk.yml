name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # ubuntu-24.04 sudah berisi Android SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Laporkan error
        if: failure()
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FotoDrive.apk
      # Link unduhan langsung (mudah dibuka dari HP): tab Releases
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FotoDrive build ${{ github.run_number }}
          files: FotoDrive.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: FotoDrive-apk
          path: FotoDrive.apk
